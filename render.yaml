services:
  - type: web
    name: inventory-management-system
    env: node
    plan: starter
    rootDir: .
    buildCommand: |
      echo "=== Building frontend ==="
      cd frontend
      npm install
      npm run build
      echo "=== Frontend build complete ==="
      ls -la dist/
      echo "=== Installing backend dependencies ==="
      cd ../backend
      npm install
      echo "=== Build complete ==="
    startCommand: cd backend && npm start
    envVars:
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        fromDatabase:
          name: inventory-management-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 7d
      - key: NODE_ENV
        value: production
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

databases:
  - name: inventory-management-db
    databaseName: inventory
    user: inventory
    plan: starter
